services:
  php:
    build: .
    # change restart to always or unless-stopped in production
    restart: "no"
    container_name: basic-php-php
    ports:
      - "8080:80" # Apache HTTP
    volumes:
      - ./website:/app
    # tty: true
    depends_on:
      basic-php-mysql:
        condition: service_healthy # Wait for MySQL healthcheck to pass before starting PHP
    environment:
      - TZ=America/Sao_Paulo
      - WEB_DOCUMENT_ROOT=/app/www/public
      - DB_HOST=basic-php-mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=basic_php
      - DB_PORT=3306
      - SRC_RELATIVE_PATH=../../src
      - VENDOR_RELATIVE_PATH=../../vendor
    networks:
      - basic_php_network

  basic-php-mysql:
    container_name: basic-php-mysql
    volumes:
      - ./db:/var/lib/mysql
    image: mysql:9.7
    restart: "no"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: basic_php
    networks:
      - basic_php_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 3

  phpmyadmin-basic-php:
    image: phpmyadmin:5.2.3
    container_name: basic-php-php-my-admin
    restart: "no"
    ports:
      - "8886:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=basic-php-mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
      - PMA_PORT=3306
      - UPLOAD_LIMIT=50M
    networks:
      - basic_php_network

networks:
  basic_php_network:
    driver: bridge
    internal: false
